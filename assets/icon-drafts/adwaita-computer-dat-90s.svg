<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 1990s PC + DAT deck, GNOME Adwaita app icon style -->

  <!-- === Monitor (left) === -->
  <rect x="4" y="10" width="26" height="16" rx="3" fill="#D8C8A8"/>
  <rect x="4" y="23" width="26" height="3" rx="1" fill="#B8A078"/>
  <rect x="7" y="13" width="20" height="11" rx="1.5" fill="#8E8B82"/>
  <rect x="9" y="15" width="16" height="7" rx="1" fill="#62A0EA"/>
  <rect x="9" y="15" width="16" height="3.5" rx="1" fill="#99C1F1" opacity="0.5"/>
  <rect x="10.5" y="16.5" width="11" height="1.5" rx="0.4" fill="#3584E4"/>

  <!-- Monitor stand -->
  <rect x="14" y="26" width="8" height="3" rx="1.2" fill="#C9B992"/>
  <rect x="14" y="28.5" width="8" height="1.5" rx="0.4" fill="#A9956B"/>
  <rect x="10" y="30" width="16" height="3" rx="1.5" fill="#D8C8A8"/>
  <rect x="10" y="32.5" width="16" height="1.5" rx="0.7" fill="#B8A078"/>

  <!-- === Tower (right, taller than monitor) === -->
  <rect x="32" y="4" width="18" height="34" rx="2.5" fill="#D8C8A8"/>
  <rect x="32" y="35" width="18" height="4" rx="1.5" fill="#B8A078"/>

  <rect x="35" y="9" width="12" height="3.5" rx="0.6" fill="#8E8B82"/>
  <rect x="36" y="10" width="10" height="1.8" rx="0.4" fill="#5E5C64"/>
  <rect x="37" y="10.8" width="8" height="0.7" rx="0.3" fill="#3D3846"/>

  <circle cx="37" cy="18" r="1.2" fill="#33D17A"/>
  <circle cx="42" cy="18" r="1.2" fill="#E66100" opacity="0.85"/>

  <rect x="45" y="12" width="1.2" height="18" rx="0.6" fill="#A9956B" opacity="0.7"/>
  <rect x="47" y="12" width="1.2" height="18" rx="0.6" fill="#A9956B" opacity="0.7"/>

  <!-- === Red arrow: computer to DAT === -->
  <rect x="37.5" y="36" width="3" height="5.5" rx="0.4" fill="#E01B24"/>
  <polygon points="39,44 35.5,39.5 42.5,39.5" fill="#E01B24"/>

  <!-- === DAT recorder === -->
  <rect x="4" y="42" width="56" height="14" rx="2.5" fill="#6E6D6A"/>
  <rect x="4" y="53" width="56" height="5" rx="2" fill="#4A4946"/>

  <rect x="8" y="45" width="34" height="7" rx="1" fill="#3D3846"/>
  <rect x="9" y="46" width="32" height="5" rx="0.8" fill="#241F31"/>
  <rect x="10" y="47.5" width="30" height="1.2" rx="0.4" fill="#5E5C64"/>

  <rect x="44" y="45" width="12" height="5" rx="0.8" fill="#2E3436"/>
  <rect x="45" y="46.2" width="10" height="2.6" rx="0.4" fill="#F6D32D" opacity="0.9"/>
  <rect x="46" y="47" width="2" height="1.2" rx="0.2" fill="#E5A50A"/>
  <rect x="49" y="47" width="2" height="1.2" rx="0.2" fill="#E5A50A"/>
  <rect x="52" y="47" width="2" height="1.2" rx="0.2" fill="#E5A50A"/>

  <circle cx="10" cy="54.5" r="1.1" fill="#C0BFBC"/>
  <circle cx="14" cy="54.5" r="1.1" fill="#C0BFBC"/>
  <circle cx="18" cy="54.5" r="1.1" fill="#C0BFBC"/>
  <rect x="22" y="53.6" width="2.2" height="2.2" rx="0.4" fill="#C0BFBC"/>

  <!-- Power plugged in -->
  <path d="M 58 48 L 62 48 L 62 52 L 58 52 Z" fill="#3D3846"/>
  <rect x="60" y="49" width="3" height="2" rx="0.3" fill="#77767B"/>
  <rect x="61.5" y="49.3" width="2" height="1.4" rx="0.2" fill="#C0BFBC"/>

  <!-- Red REC LED (flashing) -->
  <circle cx="52" cy="54.5" r="2.6" fill="#C01C28" opacity="0.35"/>
  <circle cx="52" cy="54.5" r="1.8" fill="#E01B24">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="51.5" cy="54" r="0.5" fill="#FF8A80" opacity="0.8">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
  </circle>
</svg>
